<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100" role="img" aria-label="FoodCost Monitor logo (dark background variant)">
  <defs>
    <linearGradient id="badgeGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Icon (scaled from logo-icon.svg, 240x240 -> 84x84) -->
  <g transform="translate(8,8) scale(0.35)">
    <rect x="0" y="0" width="240" height="240" rx="54" fill="url(#badgeGradientDark)"/>
    <path d="M 90 100 C 90 70 150 70 150 100" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <rect x="70" y="100" width="100" height="90" rx="14" fill="#FFFFFF"/>
    <rect x="70" y="118" width="100" height="8" fill="#DC2626"/>
    <polyline points="88,165 110,150 132,158 156,133" fill="none" stroke="#FCD34D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="156" cy="133" r="9" fill="#FCD34D" stroke="#DC2626" stroke-width="3"/>
  </g>

  <!-- Wordmark -->
  <text x="106" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">FoodCost</text>
  <text x="106" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#D1D5DB">MONITOR</text>
</svg>
