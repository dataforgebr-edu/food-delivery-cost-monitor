[project]
name = "food-delivery-cost-monitor"
version = "1.0"
description = "Pipeline de monitoramento de custos de plataforma de dados"
authors = [
    {name = "RodrigoSilva1989",email = "dataforge.br@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12,<3.15"
dependencies = [
    "taskipy (>=1.14.1,<2.0.0)",
    "boto3 (>=1.43.18,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "dbt-core (>=1.11.11,<2.0.0)",
    "dbt-athena (>=1.10.1,<2.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.0,<5.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "sqlfluff (>=4.2.1,<5.0.0)",
    "boto3-stubs[athena,glue,s3] (>=1.43.22,<2.0.0)",
    "sqlfluff-templater-dbt (>=4.2.2,<5.0.0)"
]

[tool.taskipy.tasks]
lint       = { cmd = "black --fast airflow_project/pipeline && isort airflow_project/pipeline", help = "Formata código" }
lint-check = { cmd = "black --fast --check airflow_project/pipeline && isort --check airflow_project/pipeline", help = "Verifica formatação (CI)" }
security   = { cmd = "bandit -r airflow_project/pipeline -lll", help = "Scan de segurança" }
athena_setup = { cmd = "python -m infra.athena_setup", help = "criação do banco e da tabela no glue" }

[tool.pyright]
include = ["airflow_project/pipeline"]
extraPaths = ["airflow_project/pipeline"]
venvPath = "."
venv = ".venv"
